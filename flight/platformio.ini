# PlatformIO Project Configuration File
#
#   Build options: build flags, source filter
#   Upload options: custom upload port, speed and extra flags
#   Library options: dependencies, extra library storages
#   Advanced options: extra scripting
#
# Please visit documentation for the other options and examples
# https://docs.platformio.org/page/projectconf.html


[platformio]

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         Global defaults — cascade to all [env:*] automatically
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[env]
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    ; adafruit/Adafruit ADXL375 @ ^1.1.2
    ; adafruit/Adafruit ICM20X @ ^2.0.7
    ; adafruit/Adafruit LIS2MDL@^2.1.8
build_unflags = -std=gnu++11  # C++ 20 but special :)
build_flags = -std=gnu++2a
check_tool = cppcheck
check_src_filters = +<core/> +<targets/>

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         Platform groups (referenced with ${section.key})
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[esp32_arduino]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk -DEIGEN_OS_MAC=0

[stm32_arduino]
platform = ststm32
framework = arduino
build_flags = ${env.build_flags} -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk -DEIGEN_OS_MAC=0

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         Native
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[env:native-ground_commander]
platform = native
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/native/> +<targets/ground_commander>
build_flags = ${env.build_flags} -isysroot -DNATIVE /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         ESP-32 Arduino
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[env:esp32-arduino-playground]
platform = ${esp32_arduino.platform}
board = ${esp32_arduino.board}
framework = ${esp32_arduino.framework}
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/esp32-arduino/> +<targets/playground>
build_flags = ${esp32_arduino.build_flags} -DESP32_ARDUINO

[env:esp32-arduino-hello_world]
platform = ${esp32_arduino.platform}
board = ${esp32_arduino.board}
framework = ${esp32_arduino.framework}
build_src_filter = -<*> +<core/> +<third-party/> +<targets/hello_world>
build_flags = ${esp32_arduino.build_flags}

[env:esp32-arduino-ground_commander]
platform = ${esp32_arduino.platform}
board = ${esp32_arduino.board}
framework = ${esp32_arduino.framework}
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/esp32-arduino/> +<targets/ground_commander>
build_flags = ${esp32_arduino.build_flags}

[env:esp32-arduino-gnc_test]
platform = ${esp32_arduino.platform}
board = ${esp32_arduino.board}
framework = ${esp32_arduino.framework}
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/esp32-arduino/> +<targets/gnc_test>
build_flags = ${esp32_arduino.build_flags}
lib_ldf_mode = chain
lib_compat_mode = strict

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         STM-32 Arduino
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[env:nucleo_f042k6-arduino-hello_world]
platform = ${stm32_arduino.platform}
framework = ${stm32_arduino.framework}
board = nucleo_f042k6
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/stm32-nucleo_f042k6-arduino/> +<targets/hello_world>
build_flags = ${stm32_arduino.build_flags}

[env:nucleo_f042k6-arduino-playground]
platform = ${stm32_arduino.platform}
framework = ${stm32_arduino.framework}
board = nucleo_f042k6
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/stm32-nucleo_f042k6-arduino/> +<targets/playground>
build_flags = ${stm32_arduino.build_flags}

[env:nucleo_f303re-arduino-playground]
platform = ${stm32_arduino.platform}
framework = ${stm32_arduino.framework}
board = nucleo_f303re
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/stm32-nucleo_f303re-arduino/> +<targets/playground>
build_flags = ${stm32_arduino.build_flags}

[env:nucleo_h753zi-arduino-playground]
platform = ${stm32_arduino.platform}
framework = ${stm32_arduino.framework}
board = nucleo_h753zi
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/stm32-nucleo_h753zi-arduino/> +<targets/playground>
build_flags = ${stm32_arduino.build_flags}

# -----------------------------------------------------------------------------------------------------------------------------------------------------------
#         ESP-32 IDF
# -----------------------------------------------------------------------------------------------------------------------------------------------------------

[env:esp32-idf-hello_world]
platform = espressif32
board = esp32dev
framework = espidf
build_src_filter = -<*> +<core/> +<third-party/> +<board-packages/esp32-idf/> +<lib/> +<targets/idf_hello_world>
build_flags = ${env.build_flags} -isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
